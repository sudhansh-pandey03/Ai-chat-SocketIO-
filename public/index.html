<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Socket.io Chat</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            color: #e5eefb;
            padding: 16px;
        }

        .chat-shell {
            width: 100%;
            max-width: 980px;
            min-height: 90vh;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 18px 18px 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        }

        .chat-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .chat-subtitle {
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background:
                linear-gradient(rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.92)),
                radial-gradient(circle at top, rgba(56, 189, 248, 0.08), transparent 30%);
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.mine { justify-content: flex-end; }

        .bubble {
            max-width: 78%;
            padding: 10px 12px;
            border-radius: 14px;
            background: #1f2937;
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.25);
        }

        .message-row.mine .bubble {
            background: linear-gradient(135deg, #2563eb, #8b5cf6);
            border-color: transparent;
        }

        .bubble-text { line-height: 1.35; word-break: break-word; }

        .bubble-meta {
            font-size: 0.78rem;
            color: #cbd5e1;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .chat-footer {
            padding: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.96);
        }

        .composer {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 999px;
            padding: 12px 14px;
            font-size: 1rem;
            outline: none;
            background: #111827;
            color: #eff6ff;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            color: white;
            transition: transform 0.08s ease, filter 0.2s ease;
        }

        button:hover { filter: brightness(1.05); }
        button:active { transform: scale(0.97); }

        @media (max-width: 640px) {
            body { padding: 0; }
            .chat-shell { min-height: 100vh; border-radius: 0; }
            .chat-title { font-size: 1.05rem; }
            .bubble { max-width: 92%; }
            .composer { flex-direction: column; }
            button { min-height: 44px; }
        }
    </style>
</head>
<body>
    <main class="chat-shell">
        <header class="chat-header">
            <div class="chat-title">Simple Socket.io Chat</div>
            <div class="chat-subtitle">Open this page in two tabs to see real-time messages.</div>
        </header>

        <section class="messages" id="messages"></section>

        <footer class="chat-footer">
            <div class="composer">
                <input id="messageInput" type="text" placeholder="Type your message here..." />
                <button id="sendBtn" type="button">Send</button>
            </div>
        </footer>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        console.log('Chat page loaded');

        const socket = io();
        const messages = document.getElementById('messages');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        socket.on('connect', () => {
            console.log('Connected to server with id:', socket.id);
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
        });

        socket.on('aiResponse', (data) => {
            console.log('Received AI response:', data);
            appendMessage(data, false);
        });

        function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendMessage({
        text,
        sentAt: new Date().toLocaleTimeString()
    }, true);

    socket.emit('aiMassage', text);

    input.value = '';
    input.focus();
}

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') sendMessage();
        });

        function appendMessage(data, isMine) {
            const row = document.createElement('div');
            row.className = `message-row ${isMine ? 'mine' : ''}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `
                <div class="bubble-text">${escapeHtml(data.text)}</div>
                <div class="bubble-meta">
                    <span>${isMine ? 'You' : 'Friend'}</span>
                    <span>${data.sentAt || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
            `;

            row.appendChild(bubble);
            messages.appendChild(row);
            messages.scrollTop = messages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
